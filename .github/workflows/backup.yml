name: backup

# A REUSABLE workflow: snapshot a repository's code BEFORE a merge replaces it.
# Call it from any repo's own workflow (see README). It writes a compressed copy
# into a dumps repo, keeps the newest `keep` per repository, and rolls over to a
# new dumps repo (`dumps-2`, `dumps-3`, ...) when the current one is full.

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "The ref to snapshot. Leave empty to use the PR's BASE commit (the pre-merge state)."
        type: string
        required: false
        default: ""
      dumps_repo:
        description: "The dumps repo name."
        type: string
        required: false
        default: "dumps"
      dumps_owner:
        description: "The dumps repo owner. Default: the source repo's owner."
        type: string
        required: false
        default: ""
      keep:
        description: "How many backups to keep per repository."
        type: number
        required: false
        default: 100
      max_mb:
        description: "The dumps repo size cap in MB before rolling to a new repo."
        type: number
        required: false
        default: 800
      restore_test:
        description: "Do NOT back up. Unpack the newest dump and compare it, file for file, with the commit it holds."
        type: boolean
        required: false
        default: false
    secrets:
      BACKUP_TOKEN:
        description: "A token with contents:write on the dumps repo and contents:read on the source."
        # NOT required, deliberately. When this was `true`, a caller that did not
        # hold the secret was rejected at workflow-validation time - before any job
        # was created - so the "is the token set?" guard below could never run, and
        # the failure left no log, no check run and no annotation. That is exactly
        # what happened to forge/backup.yml: 40 runs, 40 startup failures, and no
        # way to see why. Optional means a missing token reaches the guard, which
        # warns and skips, which is what this workflow was always designed to do.
        required: false

permissions:
  contents: read

concurrency:
  # SUFFIXED, and it has to be. In a called workflow the github context reflects the
  # CALLER, so `github.workflow` here is the caller's name. forge's caller is also
  # called "backup" and also uses `${{ github.workflow }}-${{ github.ref }}`, so both
  # resolved to the same group - and GitHub refuses to schedule a called workflow
  # whose concurrency group collides with its caller's. The run then fails with zero
  # jobs, no log, no check run and no annotation, which is indistinguishable from an
  # invalid workflow file. That is what forge/backup.yml has been doing 40 times.
  group: ${{ github.workflow }}-${{ github.ref }}-snapshot
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          repository: drsamonline/backup
          path: .backup
      - name: Is the backup token set?
        id: tok
        env:
          T: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning title=backup skipped::BACKUP_TOKEN is not set on this repository, so the pre-merge backup did NOT run. Add it to enable backups."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Snapshot the pre-merge state
        if: steps.tok.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          IN_REF: ${{ inputs.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          REF="${IN_REF:-${BASE:-${{ github.sha }}}}"
          echo "backing up ${{ github.repository }} @ $REF"
          python3 .backup/backup.py \
            --repo "${{ github.repository }}" \
            --ref "$REF" \
            --dumps "${{ inputs.dumps_repo }}" \
            ${{ inputs.dumps_owner != '' && format('--owner {0}', inputs.dumps_owner) || '' }} \
            --keep ${{ inputs.keep }} \
            --max-bytes $(( ${{ inputs.max_mb }} * 1024 * 1024 ))

  # PROVE THE BACKUP IS RECOVERABLE, on demand. A backup workflow that ran is not
  # proof of recoverability - this unpacks one dump and compares it with the commit
  # it holds. Read-only: it writes nothing, and it is off unless asked for.
  restore:
    if: inputs.restore_test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          repository: drsamonline/backup
          path: .backup
      - name: Unpack one dump and compare it with its commit
        env:
          GITHUB_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          python3 .backup/backup.py \
            --restore-test \
            --repo "${{ github.repository }}" \
            --dumps "${{ inputs.dumps_repo }}" \
            ${{ inputs.dumps_owner != '' && format('--owner {0}', inputs.dumps_owner) || '' }}
